name: Build app

# Builds the self-contained macOS app (Python, libraries and ffmpeg inside) on GitHub's own Macs.
# Every push builds and tests. A push to main whose VERSION file names a version without a release yet
# publishes that release (tag v<VERSION>) with both zips. A version with a dash (1.5-beta.1) is a pre-release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_offline.py

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1 and later)
            arch: AppleSilicon
          - runner: macos-15-intel    # Intel Macs
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Version
        run: |
          echo "VERSION=$(tr -d ' \n' < VERSION)" >> "$GITHUB_ENV"
      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "AAF naar Resolve" \
            --osx-bundle-identifier be.tristannijs.aaf2drt \
            --paths engine --paths app \
            --hidden-import aaf2drt --hidden-import server \
            --add-data "engine/template.drt:." \
            --add-data "engine/fl_base.json:." \
            --add-data "engine/fl_reverb.bin:." \
            --add-data "app/index.html:." \
            --collect-all imageio_ffmpeg \
            --collect-all webview \
            app/main.py
          APP="dist/AAF naar Resolve.app"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"     # ad-hoc signature (not notarized)
      - name: Smoke test the built app
        run: |
          BIN="dist/AAF naar Resolve.app/Contents/MacOS/AAF naar Resolve"
          "$BIN" --engine --help
          "$BIN" --selftest
          "$BIN" --engine --help >/dev/null
      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/AAF naar Resolve.app" "AAF-naar-Resolve-${VERSION}-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: "*.zip"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release (once per VERSION)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \n' < VERSION); TAG="v$V"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al, niets te doen."; exit 0
          fi
          PRE=""; [[ "$V" == *-* ]] && PRE="--prerelease"
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $PRE \
            --title "AAF naar Resolve $TAG" --generate-notes
